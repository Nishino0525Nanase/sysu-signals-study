<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000" role="img" aria-labelledby="title desc">
<title id="title">冲激抽样的频谱复制：无混叠与混叠对照</title>
<desc id="desc">同一个半宽为一的三角原谱，分别以抽样角频率三和一点五复制。抽样谱纵轴乘以抽样周期归一化。第三幅主恢复频带内的邻谱相加造成混叠。</desc>
<rect width="1100" height="1000" fill="#f4f7f3"/>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#203c32}.heading{font-size:30px;font-weight:700}.paneltitle{font-size:24px;font-weight:700}.note{font-size:19px}.tick{font-size:17px;fill:#55685f}.axis{stroke:#63736b;stroke-width:1.5}.copy{fill:none;stroke:#5b88a4;stroke-width:2;stroke-dasharray:7 5;opacity:.7}.sum{fill:none;stroke:#005c3d;stroke-width:3.5;stroke-linejoin:round}</style>
<text x="50" y="47" class="heading">抽样先复制，再相加：图上每份的中心、边缘和幅度都要保留</text>
<text x="50" y="79" class="note">同一原谱的两种抽样率；纵轴统一补偿了抽样谱的 1/Tₛ 系数</text>

<rect x="35" y="100" width="1030" height="235" rx="16" fill="white" stroke="#d6e2d8"/>
<text x="57" y="134" class="paneltitle">原谱：最高角频率 ωM＝1</text>
<text x="57" y="163" class="note">X(jω)＝max(1−|ω|,0)，仅在 −1 到 1 内非零</text>
