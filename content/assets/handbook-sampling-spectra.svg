<text x="584.0" y="188" class="tick">1</text>
<line class="axis" x1="227.22222222222223" x2="227.22222222222223" y1="290" y2="295"/><text x="227.22222222222223" y="316" text-anchor="middle" class="tick">-4</text>
<line class="axis" x1="321.66666666666663" x2="321.66666666666663" y1="290" y2="295"/><text x="321.66666666666663" y="316" text-anchor="middle" class="tick">-3</text>
