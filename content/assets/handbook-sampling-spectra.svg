<text x="623" y="881" class="note">主奈奎斯特频带</text>
<text x="57" y="923" class="note">记忆：时间间隔 Tₛ → 频域间隔 2π/Tₛ；实际复制谱每份乘 1/Tₛ，恢复再乘 Tₛ。</text>
<text x="57" y="958" class="note">此图为普通三角谱的精确示例。临界边界若有冲激谱线，还必须检查相位与样值。</text>
