<rect x="35" y="350" width="1030" height="235" rx="16" fill="white" stroke="#d6e2d8"/>
<text x="57" y="384" class="paneltitle">无混叠：ωₛ＝3 ＞ 2ωM</text>
<text x="57" y="413" class="note">副本之间有空隙；低通取中央一份，并用通带增益 Tₛ 恢复幅度</text>
