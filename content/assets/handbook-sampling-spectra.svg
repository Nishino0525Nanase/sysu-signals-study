<line class="axis" x1="793.8888888888889" x2="793.8888888888889" y1="290" y2="295"/><text x="793.8888888888889" y="316" text-anchor="middle" class="tick">2</text>
<line class="axis" x1="888.3333333333334" x2="888.3333333333334" y1="290" y2="295"/><text x="888.3333333333334" y="316" text-anchor="middle" class="tick">3</text>
