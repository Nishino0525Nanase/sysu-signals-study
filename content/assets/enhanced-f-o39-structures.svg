<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1110" role="img" aria-label="四阶直接II型及二阶节级联通用结构"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#327767" stroke-width="1.5"/></marker></defs><rect width="1160" height="1110" fill="#fff"/><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#243a3b;font-size:18px}.title{font-size:26px;font-weight:700}.small{font-size:15px;fill:#61776c}.box{fill:#eff5ef;stroke:#327767;stroke-width:1.5}.wire{fill:none;stroke:#327767;stroke-width:2;marker-end:url(#arrow)}.line{fill:none;stroke:#327767;stroke-width:2}.node{fill:#327767}.sub{font-size:20px;font-weight:650}</style><text x="35" y="42" class="title">10.39｜四阶直接II型与两个二阶直接型节级联</text><text x="35" y="76" class="small">分母 D(z)=1+d₁z⁻¹+d₂z⁻²+d₃z⁻³+d₄z⁻⁴；分子为1。所有延时器均保存内部量w的历史值。</text><text x="35" y="118" class="sub">A. 四阶直接II型：输入加法器反馈系数为 −d₁、−d₂、−d₃、−d₄</text><text x="40" y="177">x[n]</text><path class="wire" d="M90 170H163"/><circle cx="185" cy="170" r="21" fill="white" stroke="#327767" stroke-width="2"/><text x="176" y="177">+</text><path class="wire" d="M206 170H1080"/><text x="1090" y="177">y[n]</text><circle class="node" cx="255" cy="170" r="4"/><text x="267" y="157">w[n]=y[n]</text><path class="wire" d="M255 170V250H325"/><rect class="box" x="325" y="226" width="68" height="48" rx="5"/><text x="347" y="258">z⁻¹</text><path class="wire" d="M393 250H505"/><circle class="node" cx="430" cy="250" r="4"/><text x="390" y="213">w[n−1]</text><path class="wire" d="M430 250V325H406"/><rect class="box" x="335" y="301" width="70" height="48" rx="5"/><text x="346" y="332">−d₁</text><path class="wire" d="M335 325H185V191"/><rect class="box" x="505" y="226" width="68" height="48" rx="5"/><text x="527" y="258">z⁻¹</text><path class="wire" d="M573 250H685"/><circle class="node" cx="610" cy="250" r="4"/><text x="570" y="213">w[n−2]</text><path class="wire" d="M610 250V373H586"/><rect class="box" x="515" y="349" width="70" height="48" rx="5"/><text x="526" y="380">−d₂</text><path class="wire" d="M515 373H185V191"/><rect class="box" x="685" y="226" width="68" height="48" rx="5"/><text x="707" y="258">z⁻¹</text><path class="wire" d="M753 250H865"/><circle class="node" cx="790" cy="250" r="4"/><text x="750" y="213">w[n−3]</text><path class="wire" d="M790 250V421H766"/><rect class="box" x="695" y="397" width="70" height="48" rx="5"/><text x="706" y="428">−d₃</text><path class="wire" d="M695 421H185V191"/><rect class="box" x="865" y="226" width="68" height="48" rx="5"/><text x="887" y="258">z⁻¹</text><path class="line" d="M933 250H970"/><circle class="node" cx="970" cy="250" r="4"/><text x="930" y="213">w[n−4]</text><path class="wire" d="M970 250V469H946"/><rect class="box" x="875" y="445" width="70" height="48" rx="5"/><text x="886" y="476">−d₄</text><path class="wire" d="M875 469H185V191"/><circle cx="185" cy="325" r="13" fill="white" stroke="#327767" stroke-width="1.5"/><text x="179" y="331" font-size="17">+</text><circle cx="185" cy="373" r="13" fill="white" stroke="#327767" stroke-width="1.5"/><text x="179" y="379" font-size="17">+</text><circle cx="185" cy="421" r="13" fill="white" stroke="#327767" stroke-width="1.5"/><text x="179" y="427" font-size="17">+</text><text x="35" y="520" class="small">按递推核对：w[n]=x[n]−d₁w[n−1]−d₂w[n−2]−d₃w[n−3]−d₄w[n−4]。反馈经逐级求和汇入输入“+”节点。</text><text x="35" y="562" class="sub">三个系统的直接型系数（代入上图）</text><rect x="35" y="580" width="1085" height="147" fill="#f7f9f6" stroke="#dce6dc"/><text x="70" y="610" font-weight="700">系统</text><text x="275" y="610" font-weight="700">d₁</text><text x="480" y="610" font-weight="700">d₂</text><text x="685" y="610" font-weight="700">d₃</text><text x="890" y="610" font-weight="700">d₄</text><text x="70" y="646">H₁</text><text x="275" y="646">−5/3</text><text x="480" y="646">37/36</text><text x="685" y="646">−5/18</text><text x="890" y="646">1/36</text><text x="70" y="677">H₂</text><text x="275" y="677">−3/2</text><text x="480" y="677">2</text><text x="685" y="677">−5/4</text><text x="890" y="677">1/2</text><text x="70" y="708">H₃</text><text x="275" y="708">−2</text><text x="480" y="708">7/4</text><text x="685" y="708">−3/4</text><text x="890" y="708">1/8</text><text x="35" y="772" class="sub">B. 二阶节级联：每节内部都采用两个延时器的直接II型</text><text x="35" y="804" class="small">每个节 Q(z)=1/(1−az⁻¹+bz⁻²)：节点递推 r[n]=输入[n]+a·r[n−1]−b·r[n−2]。</text><text x="35" y="867" font-weight="700">H₁</text><text x="95" y="867">x[n]</text><path class="wire" d="M150 860H215"/><rect class="box" x="215" y="835" width="315" height="52" rx="7"/><text x="233" y="867">第一二阶节：a=1，b=1/4</text><path class="wire" d="M530 860H635"/><text x="559" y="849">v[n]</text><rect class="box" x="635" y="835" width="315" height="52" rx="7"/><text x="651" y="867">第二二阶节：a=2/3，b=1/9</text><path class="wire" d="M950 860H1040"/><text x="1050" y="867">y[n]</text><text x="35" y="944" font-weight="700">H₂</text><text x="95" y="944">x[n]</text><path class="wire" d="M150 937H215"/><rect class="box" x="215" y="912" width="315" height="52" rx="7"/><text x="233" y="944">第一二阶节：a=1，b=1/2</text><path class="wire" d="M530 937H635"/><text x="559" y="926">v[n]</text><rect class="box" x="635" y="912" width="315" height="52" rx="7"/><text x="651" y="944">第二二阶节：a=1/2，b=1</text><path class="wire" d="M950 937H1040"/><text x="1050" y="944">y[n]</text><text x="35" y="1021" font-weight="700">H₃</text><text x="95" y="1021">x[n]</text><path class="wire" d="M150 1014H215"/><rect class="box" x="215" y="989" width="315" height="52" rx="7"/><text x="233" y="1021">第一二阶节：a=1，b=1/2</text><path class="wire" d="M530 1014H635"/><text x="559" y="1003">v[n]</text><rect class="box" x="635" y="989" width="315" height="52" rx="7"/><text x="651" y="1021">第二二阶节：a=1，b=1/4</text><path class="wire" d="M950 1014H1040"/><text x="1050" y="1021">y[n]</text><text x="35" y="1093" class="small">每节反馈为“+a、−b”；两节共4个延时器。H₁可再拆为实一阶节；H₂、H₃含复极点，不能全拆成实一阶节。</text></svg>