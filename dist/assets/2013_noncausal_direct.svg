<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="530" viewBox="0 0 1080 530"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#607385"/></marker></defs><rect width="100%" height="100%" fill="#f8fafb"/><g font-family="DejaVu Sans,Noto Sans CJK SC,sans-serif" font-size="18" fill="#1e293b"><text x="540" y="35" font-size="23" text-anchor="middle">双边系统的形式直接Ⅱ型（须配非因果边界条件）</text><circle cx="150" cy="155" r="22" fill="white" stroke="#087f8c" stroke-width="2"/><text x="150" y="162" font-size="18" text-anchor="middle">+</text><polyline points="35,155 128,155" fill="none" stroke="#607385" stroke-width="2" marker-end="url(#a)"/><circle cx="75" cy="155" r="4" fill="#087f8c"/><text x="65" y="135" font-size="18" text-anchor="middle">x(t)</text><polyline points="172,155 390,155" fill="none" stroke="#607385" stroke-width="2" marker-end="url(#a)"/><rect x="396.0" y="131.0" width="88" height="48" rx="5" fill="#e5f4f1" stroke="#087f8c" stroke-width="2"/><text x="440" y="161" font-size="18" text-anchor="middle">1/s</text><polyline points="484,155 630,155" fill="none" stroke="#607385" stroke-width="2" marker-end="url(#a)"/><circle cx="550" cy="155" r="4" fill="#087f8c"/><text x="550" y="135" font-size="18" text-anchor="middle">v(t)</text><rect x="636.0" y="131.0" width="88" height="48" rx="5" fill="#e5f4f1" stroke="#087f8c" stroke-width="2"/><text x="680" y="161" font-size="18" text-anchor="middle">1/s</text><polyline points="724,155 820,155" fill="none" stroke="#607385" stroke-width="2" marker-end="url(#a)"/><circle cx="800" cy="155" r="4" fill="#087f8c"/><text x="800" y="135" font-size="18" text-anchor="middle">w(t)</text><polyline points="550,155 550,90 150,90 150,133" fill="none" stroke="#607385" stroke-width="2" marker-end="url(#a)"/><text x="350" y="75" font-size="18" text-anchor="middle">+1</text><polyline points="800,155 800,55 110,55 110,130 134,139" fill="none" stroke="#607385" stroke-width="2" marker-end="url(#a)"/><text x="700" y="51" font-size="16" text-anchor="middle">+2</text><circle cx="945" cy="375" r="22" fill="white" stroke="#087f8c" stroke-width="2"/><text x="945" y="382" font-size="18" text-anchor="middle">+</text><polyline points="967,375 1040,375" fill="none" stroke="#607385" stroke-width="2" marker-end="url(#a)"/><text x="1010" y="355" font-size="18" text-anchor="middle">y(t)</text><polyline points="75,155 75,335 945,335 945,353" fill="none" stroke="#607385" stroke-width="2" marker-end="url(#a)"/><text x="120" y="320" font-size="18" text-anchor="middle">直通 +1</text><polyline points="550,155 550,235" fill="none" stroke="#607385" stroke-width="2" marker-end="url(#a)"/><rect x="506.0" y="236.0" width="88" height="48" rx="5" fill="#e5f4f1" stroke="#087f8c" stroke-width="2"/><text x="550" y="266" font-size="18" text-anchor="middle">−5/3</text><polyline points="550,284 550,375 923,375" fill="none" stroke="#607385" stroke-width="2" marker-end="url(#a)"/><polyline points="800,155 800,235" fill="none" stroke="#607385" stroke-width="2" marker-end="url(#a)"/><rect x="756.0" y="236.0" width="88" height="48" rx="5" fill="#e5f4f1" stroke="#087f8c" stroke-width="2"/><text x="800" y="266" font-size="18" text-anchor="middle">+7/3</text><polyline points="800,284 800,415 945,415 945,397" fill="none" stroke="#607385" stroke-width="2" marker-end="url(#a)"/><text x="540" y="468" font-size="18" text-anchor="middle">w′=v；v′=x+v+2w；y=x−(5/3)v+(7/3)w</text><text x="540" y="505" font-size="16" text-anchor="middle">ROC −1&lt;Re(s)&lt;2：+2 模态在未来设边界，不能全部按因果零状态启动</text></g></svg>