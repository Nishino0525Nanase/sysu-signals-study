<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="790" viewBox="0 0 1140 790" role="img" aria-labelledby="title desc"><title id="title">中文s平面与z平面ROC对照</title><desc id="desc">两个指定代数系统各有三种ROC。连续稳定ROC包含虚轴，离散稳定ROC包含单位圆。中间区域稳定而非因果，右侧或外侧因果但不稳定。</desc><rect width="1140" height="790" fill="#fafcfb"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17392d}.axis{stroke:#527268;stroke-width:1.2}.pole{stroke:#9c3a26;stroke-width:2}.unit{fill:none;stroke:#286bb0;stroke-width:1.5;stroke-dasharray:5 4}</style><text x="26" y="34" font-size="24" text-anchor="start">同一代数式，ROC不同，系统就不同</text><text x="26" y="64" font-size="16" text-anchor="start">s平面示例：H(s)=1/[(s+1)(s−2)]；竖直虚线为虚轴</text><g transform="translate(22,82)"><rect width="350" height="268" rx="12" fill="white" stroke="#c6d8d0"/><text x="175" y="24" font-size="18" text-anchor="middle">Re s &lt; −1</text><rect x="25" y="40" width="80" height="165" fill="#f4e4ce"/><line x1="25" y1="126" x2="325" y2="126" class="axis"/><line x1="150" y1="40" x2="150" y2="205" class="axis"/><line x1="150" y1="40" x2="150" y2="205" stroke="#286bb0" stroke-dasharray="5 4"/><line x1="101" y1="122" x2="109" y2="130" class="pole"/><line x1="101" y1="130" x2="109" y2="122" class="pole"/><line x1="236" y1="122" x2="244" y2="130" class="pole"/><line x1="236" y1="130" x2="244" y2="122" class="pole"/><text x="105" y="149" font-size="13" text-anchor="middle">−1</text><text x="150" y="149" font-size="13" text-anchor="middle">0</text><text x="240" y="149" font-size="13" text-anchor="middle">2</text><text x="323" y="117" font-size="14" text-anchor="end">σ</text><text x="157" y="52" font-size="14" text-anchor="start">jω</text><text x="175" y="233" font-size="17" text-anchor="middle">非因果 · 不稳定</text></g><g transform="translate(395,82)"><rect width="350" height="268" rx="12" fill="white" stroke="#c6d8d0"/><text x="175" y="24" font-size="18" text-anchor="middle">−1 &lt; Re s &lt; 2</text><rect x="105" y="40" width="135" height="165" fill="#daf0e4"/><line x1="25" y1="126" x2="325" y2="126" class="axis"/><line x1="150" y1="40" x2="150" y2="205" class="axis"/><line x1="150" y1="40" x2="150" y2="205" stroke="#286bb0" stroke-dasharray="5 4"/><line x1="101" y1="122" x2="109" y2="130" class="pole"/><line x1="101" y1="130" x2="109" y2="122" class="pole"/><line x1="236" y1="122" x2="244" y2="130" class="pole"/><line x1="236" y1="130" x2="244" y2="122" class="pole"/><text x="105" y="149" font-size="13" text-anchor="middle">−1</text><text x="150" y="149" font-size="13" text-anchor="middle">0</text><text x="240" y="149" font-size="13" text-anchor="middle">2</text><text x="323" y="117" font-size="14" text-anchor="end">σ</text><text x="157" y="52" font-size="14" text-anchor="start">jω</text><text x="175" y="233" font-size="17" text-anchor="middle">非因果 · 稳定</text></g><g transform="translate(768,82)"><rect width="350" height="268" rx="12" fill="white" stroke="#c6d8d0"/><text x="175" y="24" font-size="18" text-anchor="middle">Re s &gt; 2</text><rect x="240" y="40" width="85" height="165" fill="#f4e4ce"/><line x1="25" y1="126" x2="325" y2="126" class="axis"/><line x1="150" y1="40" x2="150" y2="205" class="axis"/><line x1="150" y1="40" x2="150" y2="205" stroke="#286bb0" stroke-dasharray="5 4"/><line x1="101" y1="122" x2="109" y2="130" class="pole"/><line x1="101" y1="130" x2="109" y2="122" class="pole"/><line x1="236" y1="122" x2="244" y2="130" class="pole"/><line x1="236" y1="130" x2="244" y2="122" class="pole"/><text x="105" y="149" font-size="13" text-anchor="middle">−1</text><text x="150" y="149" font-size="13" text-anchor="middle">0</text><text x="240" y="149" font-size="13" text-anchor="middle">2</text><text x="323" y="117" font-size="14" text-anchor="end">σ</text><text x="157" y="52" font-size="14" text-anchor="start">jω</text><text x="175" y="233" font-size="17" text-anchor="middle">因果 · 不稳定</text></g><text x="26" y="385" font-size="16" text-anchor="start">z平面示例：H(z)=z/[(z−1/2)(z−2)]；蓝色虚线为单位圆</text><g transform="translate(22,405)"><rect width="350" height="300" rx="12" fill="white" stroke="#c6d8d0"/><text x="175" y="24" font-size="18" text-anchor="middle">|z| &lt; 1/2</text><circle cx="173" cy="145" r="21.25" fill="#f4e4ce"/><circle cx="173" cy="145" r="21.25" fill="none" stroke="#9c3a26" stroke-width="1" stroke-dasharray="3 3"/><circle cx="173" cy="145" r="85" fill="none" stroke="#9c3a26" stroke-width="1" stroke-dasharray="3 3"/><circle cx="173" cy="145" r="42.5" class="unit"/><line x1="26" y1="145" x2="324" y2="145" class="axis"/><line x1="173" y1="45" x2="173" y2="245" class="axis"/><line x1="190.25" y1="141" x2="198.25" y2="149" class="pole"/><line x1="190.25" y1="149" x2="198.25" y2="141" class="pole"/><line x1="254" y1="141" x2="262" y2="149" class="pole"/><line x1="254" y1="149" x2="262" y2="141" class="pole"/><circle cx="173" cy="145" r="3.3" fill="white" stroke="#527268" stroke-width="1.2"/><text x="194.25" y="166" font-size="12" text-anchor="middle">1/2</text><text x="258" y="166" font-size="12" text-anchor="middle">2</text><text x="172" y="190" font-size="12" text-anchor="middle">单位圆 r=1</text><text x="321" y="136" font-size="13" text-anchor="end">Re z</text><text x="180" y="52" font-size="13" text-anchor="start">Im z</text><text x="175" y="274" font-size="17" text-anchor="middle">非因果 · 不稳定</text></g><g transform="translate(395,405)"><rect width="350" height="300" rx="12" fill="white" stroke="#c6d8d0"/><text x="175" y="24" font-size="18" text-anchor="middle">1/2 &lt; |z| &lt; 2</text><circle cx="173" cy="145" r="85" fill="#daf0e4"/><circle cx="173" cy="145" r="21.25" fill="white"/><circle cx="173" cy="145" r="21.25" fill="none" stroke="#9c3a26" stroke-width="1" stroke-dasharray="3 3"/><circle cx="173" cy="145" r="85" fill="none" stroke="#9c3a26" stroke-width="1" stroke-dasharray="3 3"/><circle cx="173" cy="145" r="42.5" class="unit"/><line x1="26" y1="145" x2="324" y2="145" class="axis"/><line x1="173" y1="45" x2="173" y2="245" class="axis"/><line x1="190.25" y1="141" x2="198.25" y2="149" class="pole"/><line x1="190.25" y1="149" x2="198.25" y2="141" class="pole"/><line x1="254" y1="141" x2="262" y2="149" class="pole"/><line x1="254" y1="149" x2="262" y2="141" class="pole"/><circle cx="173" cy="145" r="3.3" fill="white" stroke="#527268" stroke-width="1.2"/><text x="194.25" y="166" font-size="12" text-anchor="middle">1/2</text><text x="258" y="166" font-size="12" text-anchor="middle">2</text><text x="172" y="190" font-size="12" text-anchor="middle">单位圆 r=1</text><text x="321" y="136" font-size="13" text-anchor="end">Re z</text><text x="180" y="52" font-size="13" text-anchor="start">Im z</text><text x="175" y="274" font-size="17" text-anchor="middle">非因果 · 稳定</text></g><g transform="translate(768,405)"><rect width="350" height="300" rx="12" fill="white" stroke="#c6d8d0"/><text x="175" y="24" font-size="18" text-anchor="middle">|z| &gt; 2</text><rect x="26" y="45" width="298" height="200" fill="#f4e4ce"/><circle cx="173" cy="145" r="85" fill="white"/><circle cx="173" cy="145" r="21.25" fill="none" stroke="#9c3a26" stroke-width="1" stroke-dasharray="3 3"/><circle cx="173" cy="145" r="85" fill="none" stroke="#9c3a26" stroke-width="1" stroke-dasharray="3 3"/><circle cx="173" cy="145" r="42.5" class="unit"/><line x1="26" y1="145" x2="324" y2="145" class="axis"/><line x1="173" y1="45" x2="173" y2="245" class="axis"/><line x1="190.25" y1="141" x2="198.25" y2="149" class="pole"/><line x1="190.25" y1="149" x2="198.25" y2="141" class="pole"/><line x1="254" y1="141" x2="262" y2="149" class="pole"/><line x1="254" y1="149" x2="262" y2="141" class="pole"/><circle cx="173" cy="145" r="3.3" fill="white" stroke="#527268" stroke-width="1.2"/><text x="194.25" y="166" font-size="12" text-anchor="middle">1/2</text><text x="258" y="166" font-size="12" text-anchor="middle">2</text><text x="172" y="190" font-size="12" text-anchor="middle">单位圆 r=1</text><text x="321" y="136" font-size="13" text-anchor="end">Re z</text><text x="180" y="52" font-size="13" text-anchor="start">Im z</text><text x="175" y="274" font-size="17" text-anchor="middle">因果 · 不稳定</text></g><text x="26" y="744" font-size="17" text-anchor="start">记忆：连续稳定要含虚轴；离散稳定要含单位圆。因果时选择右侧／外侧ROC。</text><text x="26" y="774" font-size="14" text-anchor="start">着色区域仅示意有限画布中的部分；严格边界不含极点。图为依据定义独立绘制。</text></svg>